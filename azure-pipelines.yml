# EduNest CI Pipeline
# This pipeline copies the static web files into a staging directory 
# and publishes them as a build artifact ready for deployment.

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
# 1. Copy the necessary files to the Artifact Staging Directory
- task: CopyFiles@2
  displayName: 'Copy EduNest files to staging directory'
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)'
    Contents: |
      index.html
      styles.css
      js/**
      data/**
# 2. Publish the artifact so it can be downloaded or deployed
- task: PublishBuildArtifacts@1
  displayName: 'Publish EduNest Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'EduNest-Drop'
    publishLocation: 'Container'
